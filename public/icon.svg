<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="50%" stop-color="#181B28"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>
    <linearGradient id="larkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Turntable Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#larkGrad)" stroke-width="12" opacity="0.3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#larkGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

  <!-- Lark Music Bird & Beaming Note Glyph -->
  <g filter="url(#glow)" transform="translate(10, 0)">
    <!-- Main stem and note head -->
    <path d="M 280,130 C 280,130 330,110 370,140 C 350,175 320,185 280,185 L 280,310 C 280,345 245,370 205,370 C 165,370 135,342 135,310 C 135,275 168,248 210,248 C 235,248 258,258 268,272 L 268,130 Z" fill="url(#larkGrad)"/>
    <!-- Vibrant Wing / Bird Flare Accent -->
    <path d="M 280,135 C 315,100 365,115 385,150 C 355,160 320,150 280,165 Z" fill="url(#accentGrad)"/>
    <!-- Note inner reflection -->
    <ellipse cx="195" cy="305" rx="28" ry="18" transform="rotate(-20 195 305)" fill="url(#accentGrad)" opacity="0.8"/>
  </g>

  <!-- Soundwave Bars at bottom -->
  <g transform="translate(186, 395)" fill="url(#accentGrad)" opacity="0.9">
    <rect x="0" y="8" width="6" height="18" rx="3"/>
    <rect x="14" y="2" width="6" height="24" rx="3"/>
    <rect x="28" y="0" width="6" height="28" rx="3"/>
    <rect x="42" y="10" width="6" height="16" rx="3"/>
    <rect x="56" y="4" width="6" height="22" rx="3"/>
    <rect x="70" y="12" width="6" height="14" rx="3"/>
    <rect x="84" y="6" width="6" height="20" rx="3"/>
    <rect x="98" y="14" width="6" height="12" rx="3"/>
    <rect x="112" y="4" width="6" height="22" rx="3"/>
    <rect x="126" y="10" width="6" height="16" rx="3"/>
  </g>
</svg>
